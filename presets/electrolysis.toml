# kicad2print — Copper Electrolysis (Electroplating) Preset
#
# Use this preset when you will electroplate copper into the grooves using
# a conductive primer + copper sulfate electrolysis bath.
#
# Workflow overview:
#   1. Print the substrate (narrower grooves than wire mode — copper fills them).
#   2. Insert through-hole components.
#   3. Apply conductive primer or paint to all trace grooves.
#   4. Electroplate copper: connect board as cathode in CuSO4 bath, apply ~1–2 V.
#   5. Test traces with a multimeter.
#   6. Solder components.
#
# Usage — these two are exactly equivalent:
#   kicad2print my_board.kicad_pcb --mode electrolysis
#   kicad2print my_board.kicad_pcb --config presets/electrolysis.toml
#
# This file IS the definition of `--mode electrolysis`. It is compiled into the
# binary and applied as that mode's baseline, so editing it changes what the
# flag does. Settings layer in this order, each overriding the last:
#
#   built-in defaults  ->  this preset  ->  your own TOML  ->  CLI flags

mode = "electrolysis"

# ============================================================================
# TRACE CHANNEL CONFIGURATION
# ============================================================================

# Narrower than wire mode — the groove defines the copper trace width.
# Copper is deposited into the groove rather than a wire being laid in it.
# Typical signal traces: 0.3–0.5 mm. Power traces: 0.5–1.0 mm.
channel_width_mm = 0.7

channel_depth_mm = 0.8

# ============================================================================
# TRACE GROOVE PROFILE
# ============================================================================

# Electroplating a square-bottomed groove tends to leave the middle unfilled:
# current density is highest at the top corners and lowest at the floor centre,
# so copper grows inward from the walls and can bridge over the opening —
# sealing a void — before the floor is covered. Sloping the walls removes the
# corner, so the groove fills from the bottom up instead.
#
#   "rect"      - vertical walls (original behaviour)
#   "trapezoid" - sloped walls down to a flat floor of channel_floor_width_mm
#   "vee"       - sloped walls that converge; ignores channel_floor_width_mm
#
# A vee narrows past what the nozzle can lay, so the slicer stops opening the
# groove and the printed result ends in a truncated point instead of the flat
# shelf a trapezoid carves. That is better for plating, but it roughly halves
# the copper cross-section — prefer "trapezoid" where current capacity matters.
channel_profile = "trapezoid"
channel_floor_width_mm = 0.4

# Height of each step in a sloped wall. Set this to your slicer's layer height:
# the wall is built as a stack of thin bands, and at layer height the printed
# result is identical to a smooth ramp because the print is quantised anyway.
# A value that does not match means the bands land partway through layers, and
# the slicer rounds them off — which is the detail you were trying to keep.
#
# 0.12 matches the "Super Quality ASA PCB" Cura profile (Creality "super"
# quality is 0.12 mm layers). Change this if you print these at a different
# layer height.
taper_slice_height_mm = 0.12

# ============================================================================
# THROUGH-HOLE BARRELS
# ============================================================================

# The two copper layers are otherwise completely separate, and a straight bore
# through 2 mm of plastic cannot be reached with a brush — seed paint never
# coats it. That is why a pressed-in eyelet used to be mandatory.
#
#   "straight" - plain bore; needs an eyelet or a soldered wire stitch
#   "cone"     - countersunk from both faces, meeting at a short throat
#
# With "cone" every point of the barrel is in line of sight from one face or
# the other, so seed paint can be worked in and the plating grows from both
# mouths toward the middle. The bottom cone also forms a solder cup, which is
# what lets you solder a top-side trace from underneath.
#
# Cone mouths are much wider than the bore, so on tight pitches they are shrunk
# automatically to stay clear of other nets. Holes with no room at all stay
# straight and are reported — those still need an eyelet or a wire stitch.
#
# Cones are the point of this preset: they are what makes a plated barrel
# possible without pressing an eyelet into every hole. Every run validates the
# resulting mesh and reports what it found — read that before printing.
via_style = "cone"

# Countersink wall angle, degrees from the board surface. 45 is the standard
# countersink angle and also the steepest overhang an FDM printer holds without
# support — which matters for the bottom cone, the one that narrows as it rises.
cone_angle_deg = 45.0

# Straight section where the two cones meet. Letting them meet at a knife edge
# gives a fragile throat and nothing for the lead to locate against.
throat_height_mm = 0.4

# Material kept between a cone mouth and any foreign-net copper or the board
# edge. This is a correctness constraint, not cosmetic: merged mouths on
# different nets would short together once plated.
min_rim_mm = 0.3

# Floor for the bore diameter. Via drills in KiCad are often 0.3-0.4 mm, below
# what an FDM nozzle holds open, so bores are widened to at least this.
eyelet_diameter_mm = 1.5

# ============================================================================
# COMPONENT PAD CONFIGURATION
# ============================================================================

pad_hole_diameter_mm = 0.8

# ============================================================================
# BOARD CONFIGURATION
# ============================================================================

# Slightly thicker substrate for rigidity during the electrolysis bath process.
substrate_thickness_mm = 2.2

# For electrolysis, 1:1 scale is typical — the groove width directly sets the
# trace width, so no scaling is needed. Set to 0 for auto-scale.
scale_factor = 0.0

# ============================================================================
# SNAP-ON PAINT STENCIL + TEMPORARY PLATING BUS
# ============================================================================
#
# Generates a separate snap-on stencil (one per copper side that has traces:
# <board>_stencil_top.stl / _stencil_bottom.stl) that registers over the
# substrate via a perimeter snap-lip.
#
# Through-slots over every trace groove (plus via/pad holes so the plate clears
# inserted leads/eyelets) let you squeegee conductive paint only into the
# channels, then lift the stencil off — minimal cleanup.
#
# Enabled by default in electrolysis mode.
generate_stencil = true

# Optionally add a temporary plating bus to the stencil: a perimeter rail plus one
# stub to each electrically-isolated trace (with tie-bars), so the whole side
# plates from one cathode contact. The bus bars sit proud on the flat substrate;
# grind them off after plating to isolate the traces.
#
# OFF by default — you get a plain traces + holes stencil. Electroplating still
# needs every net shorted to the cathode, so either set this true (or pass
# --plating-bus) to have it built for you, or add the bridges yourself in KiCad.
# The bus_* keys below only take effect when this is true.
stencil_plating_bus = false

# Stencil plate thickness (also the deposited height of the grind-off bus bars).
stencil_thickness_mm = 0.5

# Extra width per side added to each trace slot (paint flow + print tolerance).
stencil_slot_clearance_mm = 0.1

# Perimeter snap-lip that wraps down over the board edge.
# wall_height only needs to be a shallow grip to keep the stencil located —
# it does not need to reach the full substrate thickness.
stencil_wall_height_mm = 1.2
stencil_wall_thickness_mm = 1.5

# Clearance between the snap-lip inner wall and the board edge.
# Smaller = tighter snap; tune to your printer (typ. 0.1–0.2 mm).
stencil_fit_clearance_mm = 0.15

# Temporary plating bus geometry (only used when stencil_plating_bus = true).
bus_width_mm = 1.0   # width of the rail and the stubs
bus_inset_mm = 1.5   # how far the rail sits inside the board edge

# Tie-bars bridge the plate inside the bus rail to the outer frame so it doesn't
# print as a loose body that tears off when peeling. Each tie spans (and so
# interrupts) the painted rail, splitting it into that many arcs — clip the
# plating cathode to each arc. Extra loose islands are tied automatically only
# where needed.
bus_tie_width_mm = 2.5   # width of each tie bridge
bus_tie_count = 0        # 0 = auto (1 small board / 2 larger); set 1 for a single cathode clip

# How the stencil registers onto the PCB:
#   "ring" - flat plates + a separate, reusable L-section clamp ring. Print the
#            plates contact-face DOWN on the bed for a glass-smooth masking face;
#            the ring snaps around the PCB and a top lip wedges the plate against
#            it. Emits an extra <board>_stencil_ring.stl (one ring, reused per side).
#   "lip"  - integral perimeter lip on each plate (no separate ring), but the
#            contact face must print up, so it isn't as smooth.
stencil_mount = "ring"
ring_lip_overlap_mm = 1.5   # how far the ring's top lip covers the plate
ring_lip_height_mm = 1.0    # height of that lip above the plate

# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================

output_format = "stl"
output_dir = "./output"
