# kicad2print Configuration File
#
# This is the default configuration for kicad2print.
# Copy this to your project directory and modify as needed.
#
# All dimensions are in millimeters.

# ============================================================================
# TRACE CHANNEL CONFIGURATION
# ============================================================================
#
# These settings control how the copper wire traces will fit into the
# 3D-printed substrate.

# Width of the groove channels that will hold copper wire traces
#
# Recommended values:
#   - 30 AWG Kynar wire: 1.0-1.2 mm
#   - 28 AWG Kynar wire: 1.2-1.5 mm
#   - 24 AWG wire:       1.5-2.0 mm
channel_width_mm = 1.2

# Depth of the groove channels below the substrate surface
#
# A deeper channel provides better mechanical support for the wire but
# makes printing more time-intensive. Typical range: 0.4-0.8 mm
channel_depth_mm = 0.5


# ============================================================================
# TRACE GROOVE PROFILE
# ============================================================================

# Cross-section of the trace grooves.
#
#   "rect"      - vertical walls, flat floor. What wire mode wants, so the wire
#                 seats flat against the floor.
#   "trapezoid" - sloped walls down to channel_floor_width_mm.
#   "vee"       - sloped walls that converge. Ignores channel_floor_width_mm.
#                 The model narrows past what a nozzle can lay, so the slicer
#                 stops opening the groove and it ends in a truncated point
#                 rather than the flat shelf a trapezoid carves.
#
# Sloped walls matter when electroplating. A square-bottomed groove plates
# unevenly: current density is highest at the top corners and lowest at the
# floor centre, so copper grows inward from the walls and can seal over the top
# — leaving a void — before the floor is covered. Removing the corner lets the
# groove fill from the bottom up. Sloped walls also print better on a 0.4 mm
# nozzle, most of all on the underside, where a square groove has to be closed
# off by bridging a flat ceiling.
#
# The trade-off is copper cross-section: a vee carries roughly half of what a
# rect does at the same width and depth.
channel_profile = "rect"

# Groove floor width when channel_profile = "trapezoid". The opening stays at
# channel_width_mm; only the bottom narrows. Ignored for "rect" and "vee".
channel_floor_width_mm = 0.4

# Step height for sloped walls. They are built as a stack of thin constant-width
# bands rather than a true ramp — set this to your slicer's layer height and the
# printed part is identical to a smooth slope, because the print is quantised to
# the same steps anyway. Smaller values cost more geometry processing.
taper_slice_height_mm = 0.2


# ============================================================================
# THROUGH-HOLE BARRELS
# ============================================================================

# How every through-hole barrel is shaped.
#
#   "straight" - a plain bore. The front and back copper networks are then
#                completely separate: a straight bore through 2 mm of plastic
#                cannot be reached with a brush, so seed paint never coats it.
#                Bridge the layers with a pressed-in eyelet, or — usually far
#                less painful — a snipped component lead soldered on both faces.
#
#   "cone"     - countersunk from both faces, meeting at a short straight
#                throat. Every point of the barrel is then in line of sight
#                from one face or the other, so seed paint can actually be
#                applied and plating grows from both mouths toward the middle.
#                No eyelet, no flange to trim. The bottom cone doubles as a
#                solder cup, which is what makes a top-side trace solderable
#                from underneath.
#
# Cone mouths are much wider than the bore they surround — a 0.8 mm hole with
# 45 degree walls through a 2.2 mm board wants a ~3 mm crater on each face. On
# fine pitches they are shrunk automatically to stay clear of other nets; holes
# with no room at all stay straight and are listed in the run output.
via_style = "straight"

# Countersink wall angle, in degrees from the board surface. 45 is both the
# standard countersink angle and the steepest overhang an FDM printer holds
# without support. That limit only binds on the bottom cone — it is the one
# that narrows as it rises; the top cone always prints cleanly.
cone_angle_deg = 45.0

# Length of the straight section where the two cones meet. Letting them meet at
# a knife edge gives a throat that prints badly and leaves the component lead
# nothing to locate against.
throat_height_mm = 0.4

# Minimum material left between a cone mouth and any foreign-net copper or the
# board edge. This is a correctness constraint rather than a cosmetic one: two
# mouths on different nets that merge would short together once plated.
min_rim_mm = 0.3

# Minimum bore diameter for vias (millimeters).
#
# KiCad via drills are commonly 0.3-0.4 mm, below what an FDM nozzle can hold
# open, so every via bore is widened to at least this. A via whose own drill is
# larger keeps its real size. If you do use eyelets, match this to them:
#   - M0.9 eyelets:  0.9 mm
#   - M1.3 eyelets:  1.3 mm
#   - M2.0 eyelets:  2.0 mm
eyelet_diameter_mm = 1.5

# --- Deprecated, kept only so older config files still load -----------------
# eyelet_style and indent_depth_mm never affected the generated geometry: vias
# have always been cut as full through-holes, whatever these were set to. Use
# via_style above instead.


# ============================================================================
# COMPONENT PAD CONFIGURATION
# ============================================================================

# Diameter of component pad through-holes (millimeters)
#
# Should be slightly larger than the component leads:
#   - Small resistor leads (0.6mm):  0.7-0.8 mm
#   - Standard component leads:      0.8-1.0 mm
#   - Larger component leads:        1.0-1.2 mm
#
# Too tight: components hard to insert
# Too loose: components wobble around
pad_hole_diameter_mm = 0.8


# ============================================================================
# BOARD CONFIGURATION
# ============================================================================

# Total thickness of the printed substrate (millimeters)
#
# Typical range: 2.5-4.0 mm
#   - Thinner (2.5mm):   faster print, less rigid
#   - Thicker (4.0mm):   slower print, more rigid
#
# With PLA @ 0.2mm layer height: 3mm = ~15 layers
substrate_thickness_mm = 3.0

# Manual scale factor for the entire board
#
# If 0: automatically scale to fit traces into channels (recommended)
# If > 0: use this exact scale factor (1.0 = 1:1 scale, 2.0 = 2x larger, etc.)
#
# Auto-scaling is recommended unless you have a specific size requirement.
scale_factor = 0.0


# ============================================================================
# OUTPUT CONFIGURATION
# ============================================================================

# Output format(s)
#
#   "stl"  - Binary STL (most compatible with slicers)
#   "3mf"  - 3MF format (modern, supports colors)
#   "both" - Generate both STL and 3MF files
output_format = "stl"

# Output directory where files will be written
#
# Will be created if it doesn't exist
output_dir = "./output"


# ============================================================================
# SNAP-ON PAINT STENCIL + TEMPORARY PLATING BUS  (mainly for electrolysis)
# ============================================================================
#
# When enabled, kicad2print also emits a snap-on stencil for each copper side
# that has traces (<board>_stencil_top.stl / _stencil_bottom.stl). The stencil
# has through-slots over every trace groove (plus via/pad holes so it clears
# inserted leads/eyelets), so you can squeegee conductive paint only into the
# channels and then lift it off (minimal cleanup).
#
# Off by default; auto-enabled when --mode electrolysis is used. You can also
# force it on with the --stencil CLI flag.
generate_stencil = false

# Optionally add a temporary plating bus to the stencil: a perimeter rail plus one
# stub to each electrically-isolated trace (with tie-bars), so the whole side
# electroplates from a single cathode contact. The bus bars sit proud on the flat
# substrate — grind them off after plating to isolate the traces.
#
# Off by default (a plain stencil masks only the traces and holes). Turn it on
# here or with the --plating-bus flag. The bus_* keys below only apply when true.
stencil_plating_bus = false

# Stencil plate thickness (also the deposited height of the grind-off bus bars).
stencil_thickness_mm = 0.5

# Extra width per side added to each trace slot (paint flow + print tolerance).
stencil_slot_clearance_mm = 0.1

# Perimeter snap-lip that wraps down over the board edge.
# wall_height only needs to be a shallow grip to keep the stencil located —
# it does not need to reach the full substrate thickness.
stencil_wall_height_mm = 1.2
stencil_wall_thickness_mm = 1.5

# Clearance between the snap-lip inner wall and the board edge.
# Smaller = tighter snap; tune to your printer (typ. 0.1–0.2 mm).
stencil_fit_clearance_mm = 0.15

# Temporary plating bus geometry (only used when stencil_plating_bus = true).
bus_width_mm = 1.0   # width of the rail and the stubs
bus_inset_mm = 1.5   # how far the rail sits inside the board edge

# Tie-bars bridge the plate inside the bus rail to the outer frame so it doesn't
# print as a loose body that tears off when peeling. Each tie spans (and so
# interrupts) the painted rail, splitting it into that many arcs — clip the
# plating cathode to each arc. Extra loose islands are tied automatically only
# where needed (and trace-enclosed islands are reported, not bridged).
bus_tie_width_mm = 2.5   # width of each tie bridge
bus_tie_count = 0        # 0 = auto (1 small board / 2 larger); set 1 for a single cathode clip

# How the stencil registers onto the PCB:
#   "ring" - flat plates + a separate, reusable L-section clamp ring. Print the
#            plates contact-face DOWN for a glass-smooth masking face; the ring
#            snaps around the PCB and a top lip wedges the plate against it.
#            Emits an extra <board>_stencil_ring.stl (one ring, reused per side).
#   "lip"  - integral perimeter lip on each plate (no separate ring); simpler to
#            handle but the contact face must print up, so it isn't as smooth.
stencil_mount = "ring"
ring_lip_overlap_mm = 1.5   # how far the ring's top lip covers the plate
ring_lip_height_mm = 1.0    # height of that lip above the plate
